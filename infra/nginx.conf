# Nginx configuration for Workyy integration
# This config routes:
#   / → Landing page (Vite build)
#   /app/* → Next.js product application
#   /api/* → Fastify realtime-server backend
#   /collab → WebSocket endpoint for collaboration

server {
    listen 80;
    server_name workyy.example.com;  # Replace with your domain

    # Increase body size for file uploads
    client_max_body_size 100M;

    # Landing page (Vite build) - root path
    location / {
        root /var/www/workyy-landing/dist;  # Path to Vite build output
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Product application (Next.js) - under /app prefix
    location /app/ {
        proxy_pass http://web:3000/;  # Docker service name from docker-compose
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket support for Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API endpoints (Fastify realtime-server)
    location /api/ {
        proxy_pass http://realtime-server:4000/api/;  # Docker service name
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers (if needed, though backend should handle this)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Idempotency-Key" always;
        
        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket endpoint for collaboration
    location /collab {
        proxy_pass http://realtime-server:4000/collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://realtime-server:4000/health;
        access_log off;
    }
}

