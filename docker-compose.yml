services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      NODE_ENV: development
    volumes:
      - .:/app
    depends_on:
      - realtime-server

  realtime-server:
    build:
      context: .
      dockerfile: apps/realtime-server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/workyy
      REDIS_URL: redis://redis:6379
      AUTH0_DOMAIN: your-tenant.auth0.com
      AUTH0_AUDIENCE: https://api.workyy.dev
      AUTH0_CLIENT_ID: replace-me
      AUTH0_CLIENT_SECRET: replace-me
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workyy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  otel-collector:
    image: otel/opentelemetry-collector:0.102.1
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./infra/docker/otel-collector.yaml:/etc/otel-config.yaml:ro
    ports:
      - "4317:4317"

volumes:
  postgres-data:

